services:
  mysql-service:
    image: mysql:8.0
    container_name: peoplehub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: mahdi855/springboot-app:latest
    build:
      context: ./springboot/app
      dockerfile: Dockerfile
      secrets:
        - build-ca
    pull_policy: build
    container_name: peoplehub-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-service:3306/demo
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,http://44.218.110.160:4200,http://44.218.110.160:31238}
    depends_on:
      mysql-service:
        condition: service_healthy

  frontend:
    image: mahdi855/angular-app:latest
    container_name: peoplehub-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:

secrets:
  build-ca:
    file: ./springboot/app/build-ca.crt