name: Angular and Spring Boot CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build, test, and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Angular
        working-directory: angular-app
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: springboot/app/pom.xml

      - name: Test Spring Boot
        working-directory: springboot/app
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & push Angular container
      - name: Build and push Angular Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./angular-app
          push: true
          tags: mahdi855/angular-app:latest

      # Build & push Spring Boot container
      - name: Build and push Spring Boot Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./springboot/app
          push: true
          tags: mahdi855/springboot-app:latest